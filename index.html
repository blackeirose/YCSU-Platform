<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YCSU Platform — Product Registry</title>
<meta name="description" content="Central registry and entry point for the YCSU product ecosystem." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>" />
<style>
  :root {
    --bg: #0b0e14;
    --bg-elev: #11151f;
    --card: #151a26;
    --card-border: #232a3a;
    --text: #e7ebf3;
    --text-dim: #9aa4b8;
    --text-faint: #5c6478;
    --accent: #5eb1ff;
    --accent-dim: #2a5f8f;
    --live: #3ecf8e;
    --live-bg: rgba(62, 207, 142, 0.12);
    --dev: #f0b94d;
    --dev-bg: rgba(240, 185, 77, 0.12);
    --planned: #8b93a8;
    --planned-bg: rgba(139, 147, 168, 0.12);
    --pending: #c07bf0;
    --pending-bg: rgba(192, 123, 240, 0.12);
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #182036 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  header.hero {
    text-align: center;
    margin-bottom: 48px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(94, 177, 255, 0.1);
    border: 1px solid rgba(94, 177, 255, 0.25);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 20px;
  }

  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 8px var(--live);
  }

  h1 {
    font-size: clamp(28px, 5vw, 42px);
    margin: 0 0 12px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }

  .sub {
    color: var(--text-dim);
    font-size: 16px;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .summary-bar {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: 32px;
    flex-wrap: wrap;
  }

  .summary-stat {
    text-align: center;
  }

  .summary-stat .n {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }

  .summary-stat .l {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin-top: 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border-color 0.15s ease, transform 0.15s ease;
    position: relative;
  }

  .card:hover {
    border-color: var(--accent-dim);
    transform: translateY(-2px);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .card h2 {
    font-size: 18px;
    margin: 0 0 4px;
    font-weight: 620;
  }

  .card .tagline {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .badge {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .badge.live { color: var(--live); background: var(--live-bg); }
  .badge.dev { color: var(--dev); background: var(--dev-bg); }
  .badge.planned { color: var(--planned); background: var(--planned-bg); }
  .badge.pending { color: var(--pending); background: var(--pending-bg); }

  .meta-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12.5px;
    border-top: 1px solid var(--card-border);
    padding-top: 12px;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  .meta-row .k { color: var(--text-faint); }
  .meta-row .v { color: var(--text-dim); text-align: right; }

  .card .domain-link {
    color: var(--accent);
    text-decoration: none;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
  }

  .card .domain-link:hover { text-decoration: underline; }
  .card .domain-static {
    color: var(--text-faint);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
  }

  .notes {
    font-size: 12px;
    color: var(--text-faint);
    line-height: 1.5;
    font-style: italic;
  }

  footer {
    text-align: center;
    margin-top: 56px;
    color: var(--text-faint);
    font-size: 12px;
    line-height: 1.8;
  }

  footer a { color: var(--text-dim); }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --card-border: #e3e7f0;
      --text: #161a24;
      --text-dim: #565f74;
      --text-faint: #8991a4;
    }
    body { background: radial-gradient(ellipse 120% 80% at 50% -10%, #e7edfb 0%, var(--bg) 55%); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow"><span class="dot"></span> main.ycsu.cc</div>
      <h1>YCSU Platform</h1>
      <p class="sub">Central registry and entry point for the YCSU product ecosystem — every tool, its status, and where to find it.</p>
      <div class="summary-bar" id="summary-bar"></div>
    </header>

    <main class="grid" id="grid"></main>

    <footer>
      Source of truth: <a href="https://github.com/blackeirose/YCSU-Platform" target="_blank" rel="noopener">github.com/blackeirose/YCSU-Platform</a><br />
      Registry data last updated <span id="updated-date"></span>.
    </footer>
  </div>

<script>
  const STATUS_BADGE = {
    "LIVE": { cls: "live", label: "Live" },
    "DEPLOYED - DNS PENDING": { cls: "pending", label: "DNS Pending" },
    "NOT CONFIGURED": { cls: "planned", label: "Not Deployed" },
    "IN DEVELOPMENT": { cls: "dev", label: "In Development" }
  };

  function badgeFor(status, maturity) {
    if (STATUS_BADGE[status]) return STATUS_BADGE[status];
    if (maturity === "In Development") return { cls: "dev", label: "In Development" };
    return { cls: "planned", label: status || "Unknown" };
  }

  function render(data) {
    const grid = document.getElementById("grid");
    const products = data.products || [];

    const liveCount = products.filter(p => p.status === "LIVE").length;
    const devCount = products.filter(p => p.status !== "LIVE").length;

    document.getElementById("summary-bar").innerHTML = `
      <div class="summary-stat"><div class="n">${products.length}</div><div class="l">Products</div></div>
      <div class="summary-stat"><div class="n">${liveCount}</div><div class="l">Live</div></div>
      <div class="summary-stat"><div class="n">${devCount}</div><div class="l">In Progress</div></div>
    `;
    document.getElementById("updated-date").textContent = data.updated || "unknown";

    grid.innerHTML = products.map(p => {
      const badge = badgeFor(p.status, p.maturity);
      const domainHtml = p.url
        ? `<a class="domain-link" href="${p.url}" target="_blank" rel="noopener">${p.domain}</a>`
        : `<span class="domain-static">${p.domain || "—"}</span>`;
      return `
        <article class="card">
          <div class="card-top">
            <div>
              <h2>${p.name}</h2>
              <div class="tagline">${p.tagline || ""}</div>
            </div>
            <span class="badge ${badge.cls}">${badge.label}</span>
          </div>
          ${domainHtml}
          <div class="meta-list">
            <div class="meta-row"><span class="k">Deployment</span><span class="v">${p.deploymentProvider || "—"}</span></div>
            <div class="meta-row"><span class="k">Backend</span><span class="v">${p.backend || "—"}</span></div>
            <div class="meta-row"><span class="k">Visibility</span><span class="v">${p.visibility || "—"}</span></div>
          </div>
          ${p.notes ? `<div class="notes">${p.notes}</div>` : ""}
        </article>
      `;
    }).join("");
  }

  fetch("registry.json")
    .then(r => r.json())
    .then(render)
    .catch(err => {
      document.getElementById("grid").innerHTML = `<p style="color:#f0b94d">Could not load registry.json: ${err}</p>`;
    });
</script>
</body>
</html>
