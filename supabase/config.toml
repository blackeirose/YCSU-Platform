# Supabase project config for YCSU Platform's Registry data layer.
# Project: ysu-tool-tracker (fzydsnxxcdllkjxwdiwn) — reused, see docs/DATA_LAYER.md
# for why this project (not a new one) hosts product_registry.
project_id = "fzydsnxxcdllkjxwdiwn"

[functions.registry-ops]
# Auth is checked in-function: existing management key, or a verified owner
# Supabase Auth JWT restricted to authorize/reorder. Mixed callers require this off.
verify_jwt = false

[functions.writing-ops]
# Public read projection; exact owner validated in handler for all other operations.
verify_jwt = false
[functions.writing-content]
# Exact existing owner is verified server-side for article reads/writes; public content projection only.
verify_jwt = false
